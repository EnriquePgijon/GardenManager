<!-- Pantalla de inicio de sesión -->
<div class="min-h-screen bg-green-50 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

    <!-- Logo y título -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-green-700"> GardenManager</h1>
      <p class="text-gray-500 mt-2">Inicia sesión para continuar</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
      {{ error }}
    </div>

    <!-- Formulario de login -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="Introduce tu usuario"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Introduce tu contraseña"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <button
        (click)="login()"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition duration-200">
        Iniciar sesión
      </button>
    </div>

  </div>
</div>
